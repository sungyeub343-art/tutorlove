<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#14213d 0%,#1f3160 60%,#2b4a8a 100%);color:#fff;position:relative;word-break:keep-all}
.glow{position:absolute;right:-160px;top:-180px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(232,93,117,.45),transparent 68%)}
.heart{position:absolute;right:70px;top:150px;width:330px;height:330px;opacity:.95;filter:drop-shadow(0 24px 50px rgba(0,0,0,.35))}
.box{position:absolute;left:80px;top:64px;right:440px}
.brand{display:flex;align-items:center;gap:16px;font-size:44px;font-weight:900;letter-spacing:-.02em}
.brand img{width:64px;height:64px;border-radius:14px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.brand span{color:#ff7d93}.brand b{font-weight:900}
h1{margin-top:44px;font-size:56px;line-height:1.22;font-weight:900;letter-spacing:-.01em}
h1 em{font-style:normal;color:#f4b942}
.sub{margin-top:20px;font-size:25px;font-weight:500;opacity:.85}
.phone{position:absolute;left:80px;bottom:62px;display:flex;align-items:center;gap:18px;background:#e85d75;border-radius:999px;padding:16px 38px 16px 22px;box-shadow:0 14px 34px rgba(232,93,117,.4)}
.phone .ic{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center}
.phone b{font-size:46px;font-weight:900;letter-spacing:.02em}
.phone small{display:block;font-size:19px;font-weight:700;opacity:.9;margin-bottom:-6px}
.url{position:absolute;right:80px;bottom:76px;font-size:24px;font-weight:700;opacity:.7}
</style></head><body>
<div class="glow"></div>
<img class="heart" src="logo.svg">
<div class="box">
  <div class="brand"><img src="logo.svg"><b>tutor<span>love</span></b></div>
  <h1>국제학교·외국인학교<br><em>특목고 전문 1:1 과외</em></h1>
  <p class="sub">국제중 · 국제고 · 외고 · 과학고 · IB · AP · SAT</p>
</div>
<div class="phone">
  <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="#e85d75"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div>
  <div><small>무료 상담 · 전화 / 문자</small><b>010-2928-3614</b></div>
</div>
<div class="url">tutorlove.co.kr</div>
</body></html>
